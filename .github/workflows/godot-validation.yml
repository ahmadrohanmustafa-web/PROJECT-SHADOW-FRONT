name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and launch prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot version
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Print engine version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch campaign menu headlessly
        run: godot --headless --path . --quit-after 120

      - name: Launch Mission 02 headlessly
        run: godot --headless --path . res://scenes/mission_02.tscn --quit-after 120

      - name: Launch Mission 03 headlessly
        run: godot --headless --path . res://scenes/mission_03.tscn --quit-after 120
