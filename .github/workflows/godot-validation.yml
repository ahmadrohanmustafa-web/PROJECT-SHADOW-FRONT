name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and launch prototype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate rigged main-character asset
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          mkdir -p assets/characters
          blender --background --python-exit-code 1 --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)" 
          blender --background --python-exit-code 1 --python tools/rig_main_character.py -- \
            --input scene.gltf \
            --output assets/characters/player_character.glb
          test -s assets/characters/player_character.glb

      - name: Install pinned Godot version
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Print engine version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch campaign menu headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee build-menu.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" build-menu.log; then exit 1; fi

      - name: Launch Mission 02 headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/mission_02.tscn --quit-after 120 2>&1 | tee build-mission-02.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" build-mission-02.log; then exit 1; fi

      - name: Launch Mission 03 headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/mission_03.tscn --quit-after 120 2>&1 | tee build-mission-03.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" build-mission-03.log; then exit 1; fi
