name: Windows prototype build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/windows-prototype-build.yml"

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows prototype
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify engine version
        shell: pwsh
        run: |
          $godotExe = Join-Path $env:USERPROFILE "godot\Godot_v4.7.2-stable_win64.exe"
          if (!(Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable not found at expected setup path: $godotExe"
          }

          $stdoutPath = Join-Path $env:RUNNER_TEMP "godot-version-stdout.txt"
          $stderrPath = Join-Path $env:RUNNER_TEMP "godot-version-stderr.txt"
          Write-Host "Using Godot executable: $godotExe"
          $process = Start-Process -FilePath $godotExe -ArgumentList @("--version") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath

          if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
          if (Test-Path $stderrPath) { Get-Content $stderrPath }
          if ($process.ExitCode -ne 0) {
            throw "Godot version check failed with exit code $($process.ExitCode)."
          }

      - name: Export Windows build and verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $exePath = Join-Path $buildDir "PROJECT_SHADOW_FRONT_Prototype.exe"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "godot-export-stdout.txt"
          $stderrPath = Join-Path $env:RUNNER_TEMP "godot-export-stderr.txt"
          $godotExe = Join-Path $env:USERPROFILE "godot\Godot_v4.7.2-stable_win64.exe"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          if (!(Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable not found at expected setup path: $godotExe"
          }

          Write-Host "Using Godot executable: $godotExe"
          Write-Host "Export destination: $exePath"

          $godotArgs = @(
            "--headless",
            "--path", $env:GITHUB_WORKSPACE,
            "--export-debug", "Windows Desktop",
            $exePath
          )
          $process = Start-Process -FilePath $godotExe -ArgumentList $godotArgs -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath

          Write-Host "Godot export stdout:"
          if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
          Write-Host "Godot export stderr:"
          if (Test-Path $stderrPath) { Get-Content $stderrPath }

          if ($process.ExitCode -ne 0) {
            throw "Godot Windows export failed with exit code $($process.ExitCode). See captured output above."
          }

          Write-Host "Files produced in build directory:"
          Get-ChildItem -LiteralPath $buildDir -Force -Recurse | ForEach-Object {
            if (!$_.PSIsContainer) {
              Write-Host "$($_.FullName) ($($_.Length) bytes)"
            }
          }

          if (!(Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Windows executable was not created at: $exePath"
          }

          $exe = Get-Item -LiteralPath $exePath
          if ($exe.Length -le 0) {
            throw "Windows executable is empty."
          }

          $pckFiles = @(Get-ChildItem -LiteralPath $buildDir -Filter "*.pck" -File -Recurse)
          if ($pckFiles.Count -eq 0) {
            throw "External PCK file was not created in the build directory."
          }

          Write-Host "Verified executable: $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "Verified PCK files: $($pckFiles.Count)"

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-SHADOW-FRONT-Windows-Prototype
          path: build/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
